# Netlify Configuration for FenceGuard AI PWA
[build]
  publish = "."

# Global Security & Cache Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Prevent CDN Caching of Service Worker (Crucial for Instant PWA Updates)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

# Proper MIME Type for Web App Manifest
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# Proper MIME Type for SVG App Icon
[[headers]]
  for = "/icon.svg"
  [headers.values]
    Content-Type = "image/svg+xml"
